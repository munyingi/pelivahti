name: pelivahti
version: "1.0.0"
config-version: 2
profile: pelivahti

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  gambling_tax_rate: 0.22   # tax on the gambling margin (stakes minus winnings)
  business_timezone: "{{ env_var('PELIVAHTI_TIMEZONE', 'EET') }}"  # same zone as the stream engine

models:
  pelivahti:
    +materialized: table
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      +schema: marts
    reports:
      +schema: reports
