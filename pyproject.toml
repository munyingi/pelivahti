[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pelivahti"
version = "1.0.0"
description = "Real-time betting settlement and responsible gaming pipeline for a Finnish-style operator"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Samwel Munyingi", email = "samwelmunyingi@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=16",
    "deltalake>=0.22",
    "jsonschema>=4.21",
    "confluent-kafka>=2.4",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "tzdata",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "plotly>=5.22", "pandas>=2.2"]
orchestration = ["dagster>=1.8", "dagster-dbt>=0.24", "dagster-webserver>=1.8"]
dev = ["pytest>=8", "ruff>=0.5", "reportlab>=4", "pillow>=10"]

[project.scripts]
pelivahti = "pelivahti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["kafka: needs a running Redpanda/Kafka broker (set KAFKA_BOOTSTRAP)"]

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["E501"]  # long prose strings in the PDF builder
